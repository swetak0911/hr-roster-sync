services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: roster, POSTGRES_USER: roster, POSTGRES_PASSWORD: roster }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U roster"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: bitnamilegacy/kafka:3.8
    ports: ["9094:9094"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/roster
      DATABASE_USER: roster
      DATABASE_PASSWORD: roster
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-change-me}
      TRANSPORT_ADMIN_PASSWORD: ${TRANSPORT_ADMIN_PASSWORD:-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      GLOBEX_OPERATOR_PASSWORD: ${GLOBEX_OPERATOR_PASSWORD:-globex-change-me}
      EMPLOYEE_PASSWORD: ${EMPLOYEE_PASSWORD:-employee-change-me}
      MISSING_EMPLOYEE_THRESHOLD: ${MISSING_EMPLOYEE_THRESHOLD:-0.30}
volumes: { postgres-data: {} }
